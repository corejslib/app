title: PostgreSQL

emits:
  - postgresql/cluster-update

methods:
  set-instance-status:
    title: Set PostgreSQL cluster node status
    connectionType: websockets
    params:
      - name: status
        required: true
        schema:
          type: object
          properties:
            instanceId: { type: string }
            remoteAddress: { type: string, format: ip-address }
            status: { enum: [stopped, started] }
            role:
              anyOf:
                - type: "null"
                - { enum: [primary, standby-synchronous, standby-asynchronous] }
            timeline: { type: integer }
            lsn: { type: string }
          additionalProperties: false
          required: [instanceId, remoteAddress, status]
