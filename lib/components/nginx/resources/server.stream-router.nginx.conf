<% const port = router.port,
    addressVar = "router_address_" + port,
    defaultAddressVar = router.alpns.length
        ? addressVar + "_default"
        : addressVar,
    defaultAlpns = router.alpns.filter( alpn => alpn.defaultLocalAddress ); -%>
map $ssl_preread_protocol $router_server_name_<%- port %> {

    # tls connection
    default
    $ssl_preread_server_name;

    # non-tls connection
    ""
    "_non_tls_connection";
}

map $router_server_name_<%- port %> $<%- defaultAddressVar %> {
    hostnames;

    # default tls address
    default
    "<%- router.defaultTlsLocalAddress || "" %>";

    # default non-tls address
    "_non_tls_connection"
    "<%- router.defaultNonTlsLocalAddress || "" %>";
<% for ( const [ serverName, localAddress ] of router.serverNames.entries() ) { -%>

    "<%- serverName %>"
    "<%- localAddress %>";
<% } -%>
}
<% if ( router.alpns.length ) { -%>
<% for ( const alpn of router.alpns ) { -%>

# alpn "<%- alpn.protocol %>" advertised by the client
map $ssl_preread_alpn_protocols $router_alpn_<%- port %>_<%- alpn.id %> {
    default
    "";

    "~<%- alpn.regExp %>"
    "1";
}

# server name + alpn "<%- alpn.protocol %>"
map $router_server_name_<%- port %> $<%- addressVar %>_alpn_<%- alpn.id %> {
    hostnames;

    default
    "";
<% for ( const [ serverName, localAddress ] of alpn.serverNames.entries() ) { -%>

    "<%- serverName %>"
    "<%- localAddress %>";
<% } -%>
}

map $router_alpn_<%- port %>_<%- alpn.id %> $router_alpn_specific_<%- port %>_<%- alpn.id %> {
    default
    $<%- addressVar %>_alpn_<%- alpn.id %>;

    ""
    "";
}
<% if ( alpn.defaultLocalAddress ) { -%>

# any server name + alpn "<%- alpn.protocol %>"
map $router_alpn_<%- port %>_<%- alpn.id %> $router_alpn_default_<%- port %>_<%- alpn.id %> {
    default
    "<%- alpn.defaultLocalAddress %>";

    ""
    "";
}
<% } -%>
<% } -%>

# server name + alpn: first matching alpn with the server name wins
<% for ( let n = router.alpns.length - 1; n >= 0; n-- ) { -%>
map $router_alpn_specific_<%- port %>_<%- n %> $router_alpn_specific_chain_<%- port %>_<%- n %> {
    default
    $router_alpn_specific_<%- port %>_<%- n %>;

    ""
    <%- n < router.alpns.length - 1 ? "$router_alpn_specific_chain_" + port + "_" + ( n + 1 ) : '""' %>;
}

<% } -%>
<% if ( defaultAlpns.length ) { -%>
# any server name + alpn: first matching alpn wins
<% for ( let n = defaultAlpns.length - 1; n >= 0; n-- ) { -%>
<% const id = defaultAlpns[ n ].id; -%>
map $router_alpn_default_<%- port %>_<%- id %> $router_alpn_default_chain_<%- port %>_<%- id %> {
    default
    $router_alpn_default_<%- port %>_<%- id %>;

    ""
    <%- n < defaultAlpns.length - 1 ? "$router_alpn_default_chain_" + port + "_" + defaultAlpns[ n + 1 ].id : '""' %>;
}

<% } -%>
<% } -%>
# alpn address: server name + alpn has priority over any server name + alpn
map $router_alpn_specific_chain_<%- port %>_0 $router_alpn_address_<%- port %> {
    default
    $router_alpn_specific_chain_<%- port %>_0;

    ""
    <%- defaultAlpns.length ? "$router_alpn_default_chain_" + port + "_" + defaultAlpns[ 0 ].id : '""' %>;
}

# no alpn match, fallback to server name only address
map $router_alpn_address_<%- port %> $<%- addressVar %> {
    default
    $router_alpn_address_<%- port %>;

    ""
    $<%- defaultAddressVar %>;
}
<% } -%>

server {
<% for ( const option of router.listen ) { -%>
    listen              <%- option %>;
<% } -%>

    ssl_preread         on;

    pass                $<%- addressVar %>;
}
