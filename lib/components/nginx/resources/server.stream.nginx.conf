<% for ( const serverName of serverNames ) { -%>
server {
<% for ( const option of listen ) { -%>
    listen                  <%- option %>;
<% } -%>
<% if ( server.useTls ) { -%>
<% if ( !server.isDefaultServer ) { -%>

    server_name             <%- serverName.name %>;
<% } -%>

    # tls
    ssl_certificate         "<%- serverName.certificatePath %>";
    ssl_certificate_key     "<%- serverName.privateKeyPath %>";
    ssl_stapling            <%- serverName.isSelfSignedCertificate ? "off" : "on" %>;
    ssl_stapling_verify     <%- serverName.isSelfSignedCertificate ? "off" : "on" %>;
<% if ( server.alpnProtocol ) { -%>
    ssl_alpn                "<%- server.alpnProtocol %>";
<% } -%>
<% } -%>

    proxy_pass              "<%- server.proxy.id %>";
<% if ( !server.isUdp ) { -%>
    <% if ( server.proxy.upstreamProxyProtocol === "v1" ) { -%>
    proxy_protocol          on;
    <% } else if ( server.proxy.upstreamProxyProtocol === "v2" ) { -%>
    proxy_protocol          on; # XXX v2;
    <% else { -%>
    proxy_protocol          off;
    <% } -%>
<% } -%>
}

<% } -%>
