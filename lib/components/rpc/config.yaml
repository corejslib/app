dependencies:
  - privateHttpServer
  - monitoring

optionalDependencies:
  - cluster

config:
  defaultVersion: 1

  frontend:
    location: /
    maxApiRequestBodySize: 10 MiB
    idleTimeout: 960 seconds # send pings, required for Nginx, CloudFlare
    sendPingsAutomatically: true
    httpCompress: ~
    webSocketCompress: ~
