- $id: config
  type: object
  properties:
    enabled: { type: boolean }
    url: { type: string, format: url }
    options:
      type: object
      properties:
        username: { type: ["null", string] }
        password: { type: ["null", string] }
        hostname:
          anyOf:
            - type: "null"
            - { type: string, format: hostname }
        port:
          anyOf:
            - type: "null"
            - { type: integer, format: ip-port }
        socket:
          anyOf:
            - type: "null"
            - { type: string, format: absolute-file-path }
        clientName: { type: ["null", string] }
        serviceDiscoveryAppName: { type: ["null", string] }
        serviceDiscoveryServiceName: { type: ["null", string] }
        standbyHostname:
          anyOf:
            - type: "null"
            - { type: string, format: hostname }
        standbyPort:
          anyOf:
            - type: "null"
            - { type: integer, format: ip-port }
        standbyServiceDiscoveryAppName: { type: ["null", string] }
        standbyServiceDiscoveryServiceName: { type: ["null", string] }
        checkCertificate: { type: ["null", boolean] }
        maxConnections:
          anyOf:
            - type: "null"
            - { type: integer, minimum: 1 }
        standbyMaxConnections:
          anyOf:
            - type: "null"
            - { type: integer, minimum: 1 }
        idleTimeout:
          anyOf:
            - type: "null"
            - { type: "string", format: interval }
        largeObjectReadSize:
          anyOf:
            - type: "null"
            - { type: "string", format: digital-size }

      additionalProperties: false
      required: []

  additionalProperties: false
  required: [enabled, url]
