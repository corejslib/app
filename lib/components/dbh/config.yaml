dependencies: ~

optionalDependencies:
  - cluster
  - postgresql

config:
  enabled: false
  url: postgresql://
  options:
    username: ~
    password: ~
    hostname: service-discovery
    port: 5432
    socket: ~
    appName: ~
    serviceDiscoveryAppName: postgresql
    serviceDiscoveryServiceName: postgresql
    standbyHostname: service-discovery
    standbyPort: 5432
    standbyServiceDiscoveryAppName: postgresql-sync
    standbyServiceDiscoveryServiceName: postgresql
    checkCertificate: true
    maxConnections: 10
    standbyMaxConnections: 10
    idleTimeout: 1 minute
    largeObjectReadSize: 64 KiB
